[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "netops-sentinel"
version = "0.1.0"
description = "Evidence-driven agentic AI for telecom network operations and troubleshooting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Steven3" }
]

dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]


[tool.setuptools]
package-dir = { "" = "backend/src" }


[tool.setuptools.packages.find]
where = ["backend/src"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]


[tool.coverage.run]
branch = true
source = ["netops_sentinel"]


[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
mypy_path = "backend/src"
